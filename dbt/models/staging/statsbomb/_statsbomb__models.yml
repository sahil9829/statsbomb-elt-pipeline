version: 2

models:
  - name: stg_statsbomb__competitions
    description: Competition-seasons, renamed and with the season start year parsed out.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [competition_id, season_id]
    columns:
      - name: competition_id
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: season_start_year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1950
                max_value: 2100
      - name: competition_gender
        data_tests:
          - accepted_values:
              arguments:
                values: [male, female]

  - name: stg_statsbomb__matches
    description: One row per match with home/away attributes side by side.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "home_team_id <> away_team_id"
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: match_date
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: home_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_score
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: competition_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_statsbomb__competitions')
                field: competition_id

  - name: stg_statsbomb__events
    description: >
      One row per event with analyst-friendly boolean flags. `is_goal` excludes
      penalty shoot-out kicks (period 5) so goals reconcile with the match score.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: event_type_name
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: location_x
        data_tests:
          - pitch_coordinate:
              arguments:
                axis: x
      - name: location_y
        data_tests:
          - pitch_coordinate:
              arguments:
                axis: y
      - name: end_location_x
        data_tests:
          - pitch_coordinate:
              arguments:
                axis: x
      - name: end_location_y
        data_tests:
          - pitch_coordinate:
              arguments:
                axis: y
      - name: shot_xg
        description: StatsBomb expected-goals value; only populated for shots.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
          - not_null:
              config:
                where: "is_shot and period < 5"

  - name: stg_statsbomb__lineups
    description: One row per squad member per team per match.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id, player_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "off_minute >= on_minute"
          config:
            where: "off_minute is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_starter or appeared"
    columns:
      - name: player_id
        data_tests: [not_null]
      - name: match_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_statsbomb__matches')
                field: match_id
      - name: red_cards
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
