version: 2

models:
  # ------------------------------------------------------------------ dimensions
  - name: dim_date
    description: Calendar dimension (one row per day), keyed by yyyymmdd integer.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique, not_null]
      - name: day_of_week
        description: ISO day of week (Monday = 1).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: dim_competition
    description: Competition-season dimension (e.g. FIFA World Cup 2018).
    columns:
      - name: competition_key
        data_tests: [unique, not_null]
      - name: competition_season_name
        data_tests: [not_null]

  - name: dim_team
    description: Team dimension, including an 'Unknown' member (team_id = -1).
    columns:
      - name: team_key
        data_tests: [unique, not_null]
      - name: team_id
        data_tests: [unique, not_null]

  - name: dim_player
    description: Player dimension, including an 'Unknown' member (player_id = -1) for events without a player.
    columns:
      - name: player_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [unique, not_null]
      - name: position_group
        data_tests:
          - accepted_values:
              arguments:
                values: [Goalkeeper, Defender, Midfielder, Forward]

  - name: dim_venue
    description: Stadium dimension, including an 'Unknown' member.
    columns:
      - name: venue_key
        data_tests: [unique, not_null]

  - name: dim_referee
    description: Referee dimension, including an 'Unknown' member.
    columns:
      - name: referee_key
        data_tests: [unique, not_null]

  - name: dim_event_type
    description: StatsBomb event types grouped into analyst-friendly categories.
    columns:
      - name: event_type_key
        data_tests: [unique, not_null]
      - name: event_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Shooting, Possession, Defending, Discipline, Goalkeeping, Match Admin]

  - name: dim_play_pattern
    description: How the possession containing the event started (open play, corner, ...).
    columns:
      - name: play_pattern_key
        data_tests: [unique, not_null]

  # ----------------------------------------------------------------------- facts
  - name: fct_matches
    description: One row per match with final score and team-level xG / shot totals.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "home_team_key <> away_team_key"
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: match_id
        data_tests: [unique, not_null]
      - name: match_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: competition_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key
      - name: home_team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: away_team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: venue_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_venue')
                field: venue_key
      - name: referee_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_referee')
                field: referee_key
      - name: match_result
        data_tests:
          - accepted_values:
              arguments:
                values: [home_win, away_win, draw]
      - name: home_xg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_xg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_events
    description: >
      One row per event. Flags (is_pass, is_goal, ...) are 0/1 integers so they can be
      summed directly; goals exclude penalty shoot-outs.
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: event_id
        data_tests: [unique, not_null]
      - name: match_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: competition_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key
      - name: team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: opponent_team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: player_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: event_type_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_type')
                field: event_type_key
      - name: play_pattern_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_play_pattern')
                field: play_pattern_key
      - name: shot_xg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: shot_distance_to_goal
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 145

  - name: fct_player_match
    description: One row per player per match - minutes, passing, shooting and defensive totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, player_key]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "passes_completed <= passes and shots_on_target <= shots and goals <= shots"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "minutes_played = 0"
          config:
            where: "not appeared"
    columns:
      - name: player_match_key
        data_tests: [unique, not_null]
      - name: match_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: competition_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key
      - name: player_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: opponent_team_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: minutes_played
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 135
      - name: pass_completion_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
