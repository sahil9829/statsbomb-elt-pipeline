version: 2

models:
  - name: dim_game_state
    description: >
      The scoreline from one team's point of view. Five detailed states
      (Losing by 2+ ... Winning by 2+) roll up to Losing / Drawing / Winning.
    columns:
      - name: game_state_key
        description: Team goal difference, capped to -2 .. 2.
        data_tests: [unique, not_null]
      - name: game_state
        data_tests:
          - accepted_values:
              arguments:
                values: [Losing, Drawing, Winning]

  - name: dim_match
    description: One row per match with a human-readable label for BI tools.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: match_label
        data_tests: [not_null]

  - name: fct_team_game_state
    description: >
      One row per match x team x game state. All measures are additive counts or sums;
      rates (per 90, PPDA, pressure height) are computed in the BI layer.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_key, game_state_key]
    columns:
      - name: team_game_state_key
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: team_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: game_state_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_game_state')
                field: game_state_key
      - name: minutes_in_state
        description: Clock minutes the team spent in this state (stoppage and extra time included).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 150
      - name: pressure_x_sum
        description: Sum of pressure x-coordinates; divide by pressures for average pressing height.

  - name: fct_shots
    description: One row per shot in play (shoot-outs excluded), tagged with the game state it was taken in.
    columns:
      - name: shot_key
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
      - name: player_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: game_state_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_game_state')
                field: game_state_key
      - name: xg
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
