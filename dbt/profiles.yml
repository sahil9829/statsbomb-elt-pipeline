# Two targets share one project:
#   duckdb - local development & CI, reads the processed Parquet straight from disk
#   athena - production, reads the Glue Catalog tables Terraform registers over S3
statsbomb:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'statsbomb.duckdb') }}"
      schema: main
      threads: 4

    athena:
      type: athena
      database: awsdatacatalog
      schema: "{{ env_var('DBT_SCHEMA_PREFIX', 'statsbomb') }}_marts"
      region_name: "{{ env_var('AWS_DEFAULT_REGION', 'eu-west-2') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'statsbomb') }}"
      s3_staging_dir: "{{ env_var('ATHENA_S3_STAGING_DIR', '') }}"
      s3_data_dir: "{{ env_var('ATHENA_S3_DATA_DIR', '') }}"
      s3_data_naming: schema_table_unique
      threads: 4
      num_retries: 2
